name: Generate Batman Snake

on:
  # Run automatically every 24 hours
  schedule:
    - cron: "0 0 * * *"
  
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  
  # Run on every push to main branch
  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Generates a snake game from your GitHub contribution graph
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: Nishanth0072
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#1e3a5f&color_dots=#f0f0f0,#d4d4d4,#9ca3af,#4b5563,#1e3a5f
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ffd700&color_dots=#0d0d0d,#1a1a1a,#2d2d2d,#4a4a4a,#ffd700

      # Push the generated files to the output branch
      - name: Push github-contribution-grid-snake.svg to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
